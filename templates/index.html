<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    <title>Contact Manager</title>
    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel = "stylesheet" integrity = "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin = "anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class = "container bg-dark p-5">
        <h1 class = "text-white text-center">My Contacts:</h1>
    </div>
    <br>
    <div class = "container bg-light p-2 rounded-2" id = "new-note">
        <form action = "/add" method = "post">
            <div class = "mb-0">
                <label for = "note" class = "form-label"><strong>NEW CONTACT:</strong></label>
            </div>
            <div class = "mb-3">
                <label for = "exampleFormControlInput1" class = "form-label">Name:</label>
                <input name = "name" type = "name" class = "form-control" id = "exampleFormControlInput1" placeholder = "Full Name" required>
            </div>
            <div class = "mb-3">
                <label for = "exampleFormControlInput1" class = "form-label">Phone Number:</label>
                <input name = "phone" type = "phone number" class = "form-control" id = "exampleFormControlInput1" placeholder = "Phone Number" required>
            </div>
            <div class = "mb-3">
                <label for = "exampleFormControlInput1" class = "form-label">Email:</label>
                <input name = "email" type = "email" class = "form-control" id = "exampleFormControlInput1" placeholder = "Email" required>
            </div>
            <button type = "submit" class = "btn btn-sm btn-primary mb-3"><strong>SUBMIT</strong></button>
        </form>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class = "alert alert-primary alert-dismissible fade show" role = "alert">
                        {{message}}
                        <button type = "button" class = "btn-close" data-bs-dismiss = "alert" aria-label = "Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %} 
    </div>
    <br>
    <div class = "container p-0 rounded-2" id = "contacts">
        <h5 class = "text-black">Contacts:</h5>
        <div class="row row-cols-1 row-cols-sm-1 row-cols-md-4">
            {%for contact in contacts%}
                <div class = "card bg-dark mb-3 col me-3 text-white text-center">
                    <div class = "card-header text-end"><a href = "/delete/{{contact['_id']}}" class = "btn btn-sm btn-danger"><strong>X</strong></a></div>
                    <div class = "card-body">
                        <i class="bi bi-person-circle fs-1 mb-3"></i>
                        <h5 class = "card-title">{{contact["name"]}}</h5>
                        <div class = "h5">{{contact["email"]}}</div>
                    </div>
                    <div class = "card-footer bg-transparent">{{contact["phone"]}}</div>
                </div>
            {%endfor%}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
